syntax = "proto3";

package onyx.toolchain.events;

//
// Data that should be available via this interface:
//
// - Files
//     - File Id, file path
// - Packages
//     - Package name, parent package
// - Scopes
//     - Scope id, parent scope id, scope location, scope name?
// - Symbol declared in scope
//     - Symbol id, symbol text, symbol file id, symbol line, symbol column
// - Symbol resolved
//     - Span of source, resolved to id
// - Binding
// - Types created
//


message CompilerEvents {
  repeated CompilerEvent events = 1;
}

message CompilerEvent {
  optional uint64 timestamp = 1;
  oneof data {
    EventStart start = 10;
    EventFile file = 11;
    EventPackage pack = 12;
    EventScope scope = 13;
    EventSymbol symbol = 14;
  }
}

message EventStart {
  string compiler_version = 1;
}

message EventFile {
  uint32 id = 1;

  // Full path to the loaded file
  string path = 2;
}

message EventPackage {
  uint32 id = 1;
  string package_name = 2;
  string fully_qualified_name = 3;
  uint32 parent_package_id = 4;
}

message EventScope {
  uint32 id = 1;
  uint32 parent_scope_id = 2;
  uint32 file_id = 3;
  uint32 line = 4;
  uint32 column = 5;
  string name = 6;
}

message EventSymbol {
  uint32 id = 1;
  uint32 scope_id = 2;
  string name = 3;
  uint32 file_id = 4;
  uint32 line = 5;
  uint32 column = 6;
  uint32 kind = 7;
}
